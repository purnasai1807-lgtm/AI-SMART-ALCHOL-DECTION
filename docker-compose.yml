services:
  api:
    build: ./services/api
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://interlock:interlock@postgres:5432/interlock
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-only-change-me}
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: interlock
      POSTGRES_PASSWORD: interlock
      POSTGRES_DB: interlock
    volumes: [interlock-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  ai-engine:
    build: ./services/ai-engine
    ports: ["8001:8000"]
  notification-service:
    build: ./services/notification-service
    ports: ["8002:8000"]
volumes:
  interlock-data:
