name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r services/api/requirements.txt
      - run: python -m pytest services/api/tests -q
      - run: python -m pip install -r services/ai-engine/requirements.txt
      - run: python -m pytest services/ai-engine/tests -q
      - run: python -m pip install -r services/notification-service/requirements.txt
      - run: python -m pytest services/notification-service/tests -q
